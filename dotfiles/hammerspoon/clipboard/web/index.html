<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';"
    />
    <title>Dotori Clipboard</title>
    __CLIPBOARD_STYLE__
  </head>
  <body>
    <main class="clipboard-shell" aria-label="Clipboard history" aria-hidden="true">
      <section class="clipboard-panel">
        <header class="search-region">
          <label class="search-box" for="clipboard-search">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="6.5"></circle>
              <path d="m16 16 4 4"></path>
            </svg>
            <input
              id="clipboard-search"
              type="text"
              placeholder=""
              autocomplete="off"
              autocapitalize="off"
              spellcheck="false"
              aria-label="Search clipboard"
              aria-controls="clipboard-results"
              aria-autocomplete="list"
            />
          </label>
        </header>

        <div
          id="clipboard-results"
          class="results"
          role="listbox"
          aria-label="Clipboard results"
        ></div>
      </section>
    </main>
    __CLIPBOARD_SCRIPT__
  </body>
</html>
